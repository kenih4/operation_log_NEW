<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="800" height="450"/></clipPath></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/><text font-family="Yu Gothic Light,Yu Gothic Light_MSFontService,Arial" font-weight="300" font-size="37" transform="translate(61 78)">経緯</text><text font-family="Arial,Arial_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(61 134)">•</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(76 134)">2022/12/13</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(166.208 134)">に</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(182.875 134)">SACLA CB11</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(282.354 134)">-</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(289.646 134)">1 SIP3</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(339.333 134)">の現場コントローラ表示圧力値が他に比べ</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(70.5833 156)">2</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(79.8542 156)">桁悪いことに気付く（</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(246.521 156)">2.2e</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(278.604 156)">-</text><text font-family="Yu Got