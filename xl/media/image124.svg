400" font-size="17" transform="translate(212.667 245)">-</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(219.958 245)">8Pa</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(249.542 245)">程度を示しており、真空度の悪化は見られていない。</text><text font-family="Arial,Arial_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(61 290)">•</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(76 290)">2022/12/22</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(166.208 290)">にコントローラ及び、高圧ケーブルを</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(70.5833 312)">予備品と入れ替える調査を実施したが症状は変わらなかった。</text><text font-family="Arial,Arial_MSFontService,Arial" font-weight="400" font-size="17" transform="translate(61 357)">•</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(76 357)">SIP</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(103.813 357)">本体の問題である可能性が高いため、</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(387.146 357)">2023</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(425.479 357)">年年度末停止期間の</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(575.479 357)">2024/3/11</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(659.229 357)">～</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(675.896 357)">3/13</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(712.979 357)">に</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(70.5833 379)">SIP</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,Arial" font-weight="700" font-size="17" transform="translate(98.3958 379)">本体の交換作業を実施する事となった。</text></g></svg>